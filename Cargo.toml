[package]
name = "fff"
version = "0.1.0"
edition = "2024"
description = "Fast local file index for macOS: find, sizes, duplicates, packages and git repos, with a CLI and an MCP server"
repository = "https://github.com/jverhoeks/fff"
readme = "README.md"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.105"
blake3 = { version = "1.8.7", features = ["rayon", "mmap"] }
clap = { version = "4.6.9", features = ["derive"] }
crossbeam-channel = "0.5.17"
infer = "0.22.0"
libc = "0.2.191"
memchr = "2.8.3"
memmap2 = "0.9.12"
rayon = "1.12.0"
regex = { version = "1.13.2", default-features = false, features = ["std", "perf", "unicode-case"] }
rusqlite = { version = "0.43.0", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
